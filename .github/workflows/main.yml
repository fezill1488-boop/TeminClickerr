name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project
        run: |
          mkdir project
          unzip -q TeminClicker-CloudBuild.zip -d project
          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/project" -name settings.gradle.kts -print -quit)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: TeminClicker-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution
